name: Release

# Push a tag like v1.2.0 to publish a release with ready-to-run archives.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  app-macos:
    name: Desktop app (macOS, Apple silicon and Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build PS5 Gateway.app
        run: sh scripts/build-app.sh --universal
      - name: Pack the app (keeps permissions and the signature)
        run: tar -czf app-macos.tar.gz "PS5 Gateway.app"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: app-macos.tar.gz

  app-windows:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build PS5 Gateway.exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: PS5 Gateway.exe

  release:
    needs: [app-macos, app-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: app-macos
      - uses: actions/download-artifact@v4
        with:
          name: app-windows

      - name: Build archives
        run: |
          v="${GITHUB_REF_NAME}"
          mkdir dist stage
          # Windows: the project plus the ready PS5 Gateway.exe next to scripts\ (double-click the exe; the installer
          # installer\windows\Install-PS5-Gateway.cmd is still there)
          mkdir stage-win
          git archive --format=tar --prefix=ps5-gateway/ HEAD | tar -x -C stage-win
          cp "PS5 Gateway.exe" stage-win/ps5-gateway/
          (cd stage-win && zip -qr "../dist/ps5-gateway-windows-${v}.zip" ps5-gateway)
          # macOS: the project plus the ready PS5 Gateway.app next to scripts/. A tar.gz keeps the executable bits.
          git archive --format=tar --prefix=ps5-gateway/ HEAD | tar -x -C stage
          tar -xzf app-macos.tar.gz -C stage/ps5-gateway
          tar -czf "dist/ps5-gateway-macos-${v}.tar.gz" -C stage ps5-gateway
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "PS5 Gateway ${GITHUB_REF_NAME}" --generate-notes
