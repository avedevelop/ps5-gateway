name: Release

# Push a tag like v1.1.0 to publish a release with ready-to-run installer archives.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

      - name: Build archives
        run: |
          v="${GITHUB_REF_NAME}"
          mkdir dist
          # Windows: a zip (double-click installer\windows\Install-PS5-Gateway.cmd after unpacking)
          git archive --format=zip --prefix=ps5-gateway/ -o "dist/ps5-gateway-windows-${v}.zip" HEAD
          # macOS: a tar.gz keeps the executable bit of the .command and .sh files
          git archive --format=tar.gz --prefix=ps5-gateway/ -o "dist/ps5-gateway-macos-${v}.tar.gz" HEAD
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "PS5 Gateway ${GITHUB_REF_NAME}" --generate-notes
